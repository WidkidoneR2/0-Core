# Faelight Forest -- MangoWM config

# Window effects
blur=0
shadows=0
border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.95

# Animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_open=300
animation_duration_close=500
animation_duration_move=300
animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Layout
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=1

# Appearance -- forest colors
gappih=8
gappiv=8
gappoh=12
gappov=12
borderpx=2
rootcolor=0x0d1117ff
bordercolor=0x3d444dff
focuscolor=0x3fb950ff
urgentcolor=0xf85149ff

# Tags
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile

# Keyboard
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us

# Trackpad
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
disable_while_typing=1

# Sloppyfocus
sloppyfocus=1
warpcursor=1

# Key bindings
bind=SUPER,r,reload_config
bind=SUPER,Return,spawn,alacritty
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER,space,togglefloating,
bind=SUPER,Tab,switch_layout

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Workspaces
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0

bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER,b,spawn,brave
bind=SUPER,e,spawn,alacritty -e broot
bind=SUPER,escape,spawn,faelight-logout

bind=SUPER+CTRL,2,chvt,2

# Forest Recovery INT-056 -- explicit TTY rescue, Framework media-key top row
bind=SUPER+CTRL,3,chvt,3
bind=SUPER+CTRL,4,chvt,4
bind=SUPER+CTRL,5,chvt,5
bind=SUPER+CTRL,6,chvt,6

# --- Faelight session autostart (INT-053) ---
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start faelight-session.target
