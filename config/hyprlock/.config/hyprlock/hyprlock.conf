# Faelight Forest -- hyprlock config

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(13, 17, 23)
    blur_passes = 0
}

label {
    monitor =
    text = 🌲 Faelight Forest
    color = rgba(63, 185, 80, 1.0)
    font_size = 36
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "NixOS $(nixos-version | cut -d. -f1-2)  ·  v14.1.0"
    color = rgba(139, 148, 158, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(63, 185, 80, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d %Y"
    color = rgba(139, 148, 158, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(63, 185, 80, 1.0)
    inner_color = rgba(22, 27, 34, 1.0)
    font_color = rgba(63, 185, 80, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = enter password
    rounding = 8
    check_color = rgba(63, 185, 80, 1.0)
    fail_color = rgba(248, 81, 73, 1.0)
    fail_text = wrong password ($ATTEMPTS)
    capslock_color = rgba(227, 179, 65, 1.0)
    position = 0, -120
    halign = center
    valign = center
}
