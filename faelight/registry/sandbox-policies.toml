# faelight-sandbox v3 — Policy Declarations
# INT-125: Declarative sandbox policies
# "Control is not restriction. It is understanding."

[[policy]]
name = "default"
description = "Standard sandbox — filesystem watched, network allowed"
allow_net = true
allow_fs_write = true
allow_env = []
max_cpu_seconds = 300
max_memory_mb = 1024
emit_events = true

[[policy]]
name = "untrusted"
description = "Untrusted command — network isolated, filesystem read-only"
allow_net = false
allow_fs_write = false
allow_env = ["PATH", "HOME", "TERM"]
max_cpu_seconds = 60
max_memory_mb = 256
emit_events = true

[[policy]]
name = "network-tool"
description = "Network access allowed, no filesystem writes"
allow_net = true
allow_fs_write = false
allow_env = ["PATH", "HOME", "TERM", "WAYLAND_DISPLAY"]
max_cpu_seconds = 120
max_memory_mb = 512
emit_events = true

[[policy]]
name = "build"
description = "Build environment — full access, resource tracked"
allow_net = true
allow_fs_write = true
allow_env = []
max_cpu_seconds = 600
max_memory_mb = 4096
emit_events = true

[[policy]]
name = "strict"
description = "Maximum isolation — no network, no writes, minimal env"
allow_net = false
allow_fs_write = false
allow_env = ["PATH"]
max_cpu_seconds = 30
max_memory_mb = 128
emit_events = true

[[policy]]
name = "devbox"
description = "NovaShell test sandbox -- the forest is invisible, the session is disposable"
allow_net = true
allow_fs_write = true
# Passed through by NAME. PATH so binaries resolve, TERM so the shell can draw,
# LANG so text is not mangled. Nothing else: every other variable is either
# irrelevant to a shell test or a way for the host to leak in.
allow_env = ["PATH", "TERM", "LANG", "USER"]
max_cpu_seconds = 300
max_memory_mb = 1024
emit_events = true

# The four that hide the forest. nsh-test measured on 2026-09-05 that HOME alone is
# NOT enough: state_home reads XDG_STATE_HOME independently, so health, focus.toml
# and the intent ledger stayed visible under a bare HOME redirect. Both move, plus
# the two nsh-specific overrides.
[policy.set_env]
HOME = "/tmp/devbox-{session}"
XDG_STATE_HOME = "/tmp/devbox-{session}"
XDG_CONFIG_HOME = "/tmp/devbox-{session}/.config"
FAELIGHT_STATE_DB = "/tmp/devbox-{session}/state.db"
NSH_CONFIG = "/tmp/devbox-{session}/config.nsh"
