# THE DOCTOR's CHECK SET -- DECLARATIONS, NOT MEASUREMENTS.
#
# INT-222. Each entry DECLARES what a check is: how much it matters, what severities it may
# produce, and what to do when it is red. The MEASUREMENT lives in Rust, behind the probe name.
#
# ==========================================================================================
# WHY THIS FILE EXISTS
# ==========================================================================================
#
# Every defect INT-222 was filed against lived in a hand-written CheckResult literal:
#
#     check_dotmeta     status: Status::Pass, typed, unconditional -- a check that COULD NOT FAIL
#     check_vm_state    tier: Tier::Info beside status: Status::Warn -- a warning the verdict
#                       filters out, saying "could not check" where nothing can hear it
#     27 of 34          no declared severity range at all, because a struct literal cannot
#                       declare one
#
# Nobody wrote those on purpose. They wrote them because constructing a result by hand means
# re-deciding the tier and the status at every site, with nothing checking the answer.
#
# Here the range is DECLARED ONCE and the engine ENFORCES it. A check that declares ["pass"]
# is a LABEL: excluded from the denominator, reported as declared rather than measured. A check
# that declares ["pass","warn"] CANNOT report fail -- the engine refuses the outcome.
#
# ==========================================================================================
# THE RULES THE ENGINE APPLIES
# =========================================================================================
#
#   severities        what this check MAY report. Never empty. ["pass"] alone means LABEL.
#   probe             a name from the closed registry in faelight-doctor. There is no field
#                     that carries a command string, and that absence is the gate.
#   tier              critical / system / user, from RISK.toml -- plus `info`, which here means
#                     MEASURES TRULY BUT NEVER JUDGES, excluded from the verdict entirely.
#   recovery          what to do when this is red. INT-199 shape.
#
# ⚠️ AND `info` REQUIRES ["pass"]. A tier that means "never judges" cannot hold a check that
# declares warn or fail -- that is a contradiction, and it is exactly the shape check_vm_state
# has today. The engine refuses it by name.
#
# `unknown` and `blocked` are ALWAYS permitted and are never declared: they say the check did
# not run, which is not a severity it chose to report.
#
# ==========================================================================================
# THESE VALUES WERE MEASURED, NOT CHOSEN
# ==========================================================================================
#
# Every tier and every severity below was read out of the registered function in
# domains/doctor/, on 2026-09-18, against the all_checks() list -- which is the authority for
# what actually runs. Three earlier censuses were wrong (counting a function that shares a name,
# sweeping in the next function's comment, and counting check_drift, which is not a doctor check
# at all) and each error pointed the same way. This table came from the registration list.
#
# ⭐ vm_state IS WRITTEN AS THE CODE HAS IT TODAY -- info + warn -- ON PURPOSE. It should fail
# to load. That refusal is gate 3 proven on live data rather than on a fabricated example.

[[check]]
id = "services_running"
name = "System Services"
tier = "system"
probe = "services_running"
severities = ["pass", "warn"]

