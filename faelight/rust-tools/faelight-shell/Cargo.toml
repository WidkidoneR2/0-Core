[package]
name = "faelight-shell"
license = "MIT"
version = "3.6.0"
edition = "2021"
description = "The forest's own shell -- speaks human first, UNIX as fallback. Structured data, natural-language verbs, parallel execution."

[dependencies]
faelight-core = { path = "../faelight-core" }
rustyline = "17.0.2"
colored = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
miette = { version = "7", features = ["fancy"] }
ctrlc = "3"
toml = "0.8"
faelight-git = { path = "../faelight-git" }
git2 = "0.18"
libc = "0.2"
ratatui = "0.28"
crossterm = "0.28"
portable-pty = "0.8"
logos = "0.16.1"

[dev-dependencies]
proptest = "1.11.0"
