[package]
name = "nsh-test"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "nsh permanent regression suite -- INT-304"

[dependencies]
faelight-core = { path = "../faelight-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
colored = "2"
chrono = "0.4"
# INT-172: pty support, to drive the interactive REPL rather than `fsh -c`.
# Already in Cargo.lock at four versions (rustyline pulls it) -- no new crate.
nix = { version = "0.31.1", features = ["term"] }
