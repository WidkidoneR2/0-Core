[package]
name = "faelight-git"
license = "MIT"
version = "4.4.1"
edition = "2021"
description = "Git governance for the forest -- guarded commits, health-aware verification, and intent-commit genealogy."

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
faelight-core = { path = "../faelight-core" }
# Existing
clap = { version = "4", features = ["derive"] }
colored = "2"

# NEW: Git library
git2 = "0.18"

# NEW: Error handling
anyhow = "1.0"
thiserror = "1.0"

# NEW: For risk/graph storage
serde_json = "1.0"
chrono = "0.4"

# NEW: Shared Faelight infrastructure

