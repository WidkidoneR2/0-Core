[package]
name = "novashell"
license = "MIT"
version = "3.9.0"
edition = "2021"
description = "The forest's own shell -- speaks human first, UNIX as fallback. Structured data, natural-language verbs, parallel execution."

# THE PACKAGE IS novashell; THE BINARY IS nsh.
#
# fsh collides with fish -- same abbreviation, and anyone reading fsh in a ps listing or a
# README reads it as the other shell. nsh (NovaShell) does not.
#
# A [[bin]] rather than a package rename, deliberately: the package name is what every
# dependency reference and the directory itself carry, and the wider faelight-* -> zero-*
# rename is still ahead. Renaming the package now means renaming it twice. This changes the
# one thing that needed changing -- what the shell is called when you run it.
[[bin]]
name = "nsh"
path = "src/main.rs"

[dependencies]
faelight-core = { path = "../faelight-core" }
rustyline = "17.0.2"
colored = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
miette = { version = "7", features = ["fancy"] }
toml = "0.8"
faelight-git = { path = "../faelight-git" }
git2 = "0.18"
libc = "0.2"
# INT-188 step 3: setpgid, waitpid, tcsetpgrp, tcgetpgrp and Termios, on typed fds.
#
# ALREADY IN THE LOCK at 0.38.44, pulled in transitively, so this line adds A NAME and
# not a build. The intent originally recorded "one more dependency" as the cost; measured
# 2026-09-13, that cost is zero compilation and zero new supply chain.
#
# ⚠️ libc STAYS. It is used for the SIGPIPE reset in pre_exec, which must be
# async-signal-safe and is already correct. New job-control calls go through rustix.
rustix = { version = "0.38", features = ["process", "termios", "stdio"] }
ratatui = "0.28"
crossterm = "0.28"
portable-pty = "0.8"

[dev-dependencies]
proptest = "1.11.0"
