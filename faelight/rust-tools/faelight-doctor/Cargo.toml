[package]
name = "faelight-doctor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The doctor ENGINE -- definition format, states, tiers, probe registry, validation. Shared by core doctor and nsh doctor; owns neither check set."

[lib]
name = "faelight_doctor"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
which = "6"
walkdir = "2.5"
serde_json = "1"
chrono = "0.4"
# ⭐ The paths crate. No probe hand-builds a path: that is the defect `nsh doctor` had
# (a focus.toml path built as a string beside a neighbour that looked it up properly),
# and it is also what makes this crate survive INT-247 Layer 3b -- the alias flip moves
# paths.rs, and everything that asks it moves with it.
faelight-core = { path = "../faelight-core" }
