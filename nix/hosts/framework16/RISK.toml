# INT-112: risk metadata. Read by the pre-commit hook; readable by you.
risk = "critical"
requires = ["framework16-boot"]
reason = """
The real laptop. Boot chain, disko/LUKS layout, lanzaboote + Secure Boot, the christian
account. This is the ONLY directory where a mistake can leave a machine that will not boot
or will not log in. INT-161 put Secure Boot here with custom keys enforcing; a bad signature
config is a firmware-level problem, not a rebuild-level one.
Recovery if it happens anyway (all four rehearsed or measured, INT-160/161):
  1. INSYDE menu -> "Restore secure boot to factory settings" (no file, no USB, no network)
  2. INSYDE menu -> Secure Boot off
  3. Rescue USB (INT-160 gate 7, walked on this hardware) -- NOT INDEPENDENT. That gate was
     walked BEFORE Secure Boot was enforcing. Under enforcement the USB is rejected SILENTLY:
     the firmware falls through and boots the signed disk, so it looks like the stick is blank.
     Path 3 requires path 2 first (INT-225, measured twice).
  4. sbctl reset
There is NO supervisor password on this firmware, so the menu is always reachable.
"""

# INT-225, 2026-08-18. What was actually tested, not merely assumed to exist.
recovery_verified = "2026-08-18"
recovery_verified_by = """
sbctl key backup on FORESTBACKUP restore-tested: sha256 of db, KEK and PK .pem pairs
compared against live /var/lib/sbctl -- all three match. Factory PK/KEK/db .esl also
present there and committed under secureboot-factory/.
EFI boot entries dumped and committed (redacted; full copy on FORESTBACKUP). Dangling
Boot0004 removed and the machine rebooted clean to gen 504.
efibootmgr added to systemPackages -- it was ONLY on the rescue image, which is the one
thing that cannot boot under enforcement.
NOT verified: boot counting is unavailable (lanzaboote replaces the systemd-boot module,
so its options stop applying), and no supervisor password has been confirmed by entering
the firmware menu -- only by absence of evidence.
"""

[history]
lockout = "2026-06-09 -- 24 hours locked out by a greetd change. The reason every rule here exists."

# ---------------------------------------------------------------------------
# The tier legend (INT-112). Four levels, and only ONE of them costs anything.
#
#   critical  A mistake can leave a machine that will not boot or will not log in.
#             `requires` runs before the commit lands. TWO dirs qualify: this one,
#             and nix/modules/desktop/ (greetd.nix).
#   system    A mistake degrades the machine -- slower builds, a lost test surface --
#             but it still boots and you still get in. No hook cost.
#   user      A mistake costs a tool or a prompt. Move fast. No hook cost.
#   data      Nothing reads it at boot. No hook cost.
#
# A tier that contains everything is not a tier. Enforcement is rare so that it stays
# real: a gate that fires on every commit is a gate people route around with
# --no-verify, and that is precisely how INT-113 and INT-119 both died.
# ---------------------------------------------------------------------------
