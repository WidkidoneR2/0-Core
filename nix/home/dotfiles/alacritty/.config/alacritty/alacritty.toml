[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 12.0

[terminal.shell]
program = "/run/current-system/sw/bin/faelight-shell"

# P2: the neon candy palette from faelight-core/src/theme.rs.
# Normal slots are the SOFT_/MUTED_ family, bright slots are the NEON_ family --
# the palette already had dim/bright pairs, which is the shape ANSI wants.
# Three values are NOT from theme.rs and are declared additions:
#   ink  141816  background and normal black, a green-tinted near-black
#   ash  3c4641  bright black, so the grey ramp is ink -> ash -> muted -> fog
#   dim blue 3c69be, darkened from NEON_BLUE because the palette has no dim blue

[colors.primary]
background = "#141816"
foreground = "#d7e0da"

[colors.cursor]
text   = "#141816"
cursor = "#39ff14"

[colors.normal]
black   = "#141816"
red     = "#dc6464"
green   = "#64b464"
yellow  = "#dcaa50"
blue    = "#3c69be"
magenta = "#8264b4"
cyan    = "#64c8dc"
white   = "#788c82"

[colors.bright]
black   = "#3c4641"
red     = "#ff5050"
green   = "#39ff14"
yellow  = "#ffc832"
blue    = "#508cff"
magenta = "#b482ff"
cyan    = "#32dcff"
white   = "#d7e0da"
