[package]
name = "faelight-zone"
license = "MIT"
version = "2.1.0"
edition = "2021"
description = "Zone detection - identify numbered gravity zones"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Core infrastructure  
faelight-core = { path = "../faelight-core" }

[lib]
name = "faelight_zone"
path = "src/lib.rs"

[[bin]]
name = "faelight-zone"
path = "src/main.rs"
