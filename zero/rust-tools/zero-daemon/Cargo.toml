[package]
name = "zero-daemon"
license = "MIT"
version = "4.0.0"
edition = "2021"
description = "Background daemon for Project 0 operations"

[dependencies]
# Core infrastructure
zero-core = { path = "../zero-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite for event polling
rusqlite = { version = "0.31", features = ["bundled"] }

# D-Bus IPC -- Forest Event Bus v2 (INT-294)
zbus = { version = "4", default-features = false, features = ["tokio"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Pretty output
colored = "2"
# Date/time
chrono = { version = "0.4", features = ["clock"] }

[[bin]]
name = "zero-daemon"
path = "src/main.rs"

