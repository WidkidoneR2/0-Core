[package]
name = "zero-release"
version = "1.0.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Project 0 publishes itself -- plan, preview, and cut releases as bootable, rollback-safe generations."

[[bin]]
name = "zero-release"
path = "src/main.rs"

[dependencies]
zero-core = { path = "../zero-core" }
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"
