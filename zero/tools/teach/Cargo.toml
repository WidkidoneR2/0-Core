[package]
name = "teach"
license = "MIT"
version = "4.0.1"
edition = "2021"
description = "Live system narrator — adapts to newcomer or expert"

[dependencies]
# Core infrastructure
zero-core = { path = "../zero-core", features = ["registry"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"
