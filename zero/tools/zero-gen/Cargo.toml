[package]
name = "zero-gen"
license = "MIT"
version = "1.0.0"
edition = "2021"

[dependencies]
# INT-256: libc for the broken-pipe signal only -- see main.rs. NOT zero-core: one
# signal call does not justify carrying the ledger crate.
libc = "0.2"
rand = "0.8"
colored = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
base64 = "0.22"
base32 = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zeroize = "1"
