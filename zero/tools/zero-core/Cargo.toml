[package]
name = "zero-core"
license = "MIT"
version = "1.0.1"
edition = "2021"

# P2/INT-223: zero-core was two crates wearing one name -- a portable
# foundation (paths, errors, theme) and a Wayland GUI toolkit (canvas, glyph,
# layer-shell). Every consumer inherited the toolkit, so fsh linked Wayland and
# could not build on a headless box -- which a distro's default shell must do.
# The toolkit is now behind "ui", off by default. The proper crate split is P5.
[features]
default = []
ui = ["dep:fontdue", "dep:wayland-client"]
# INT-247: the ledger opener (src/state_db.rs). Off by default; a crate that opens
# state.db enables it, and nothing else pays for rusqlite.
db = ["dep:rusqlite"]
# INT-287 G2: the tool registry reader (src/registry.rs). Off by default; the close and
# bump-versions enable it, and nothing else pays for serde and toml.
registry = ["dep:serde", "dep:toml"]

[dependencies]
libc = { workspace = true }
fontdue = { version = "0.9", optional = true }
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
wayland-client = { version = "0.31", optional = true }

[dev-dependencies]
# For testing
