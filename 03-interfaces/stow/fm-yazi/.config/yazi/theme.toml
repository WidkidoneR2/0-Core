# ═══════════════════════════════════════════════════════════
# 🌲 Faelight Forest Yazi Theme v8.0.0 - ENHANCED
# ──────────────────────────────────────────────────────────
# NEON highlights for stow packages & important files
# Smart color coding by file importance
# ═══════════════════════════════════════════════════════════

[flavor]
use = ""

[mgr]
cwd = { fg = "#8ed1a3" }

hovered         = { fg = "#0f1c16", bg = "#5bb7a5" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#c7df63", italic = true }
find_position = { fg = "#8ed1a3", bg = "reset", italic = true }

marker_selected = { fg = "#c7df63", bg = "#c7df63" }
marker_copied   = { fg = "#8ed1a3", bg = "#8ed1a3" }
marker_cut      = { fg = "#ff6b6b", bg = "#ff6b6b" }

tab_active   = { fg = "#0f1c16", bg = "#5bb7a5", bold = true }
tab_inactive = { fg = "#8ed1a3", bg = "#2e6146", bold = true }
tab_width    = 1

border_symbol = "│"
border_style  = { fg = "#5bb7a5" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#2e6146", bg = "#2e6146" }

mode_normal = { fg = "#0f1c16", bg = "#5bb7a5", bold = true }
mode_select = { fg = "#0f1c16", bg = "#c7df63", bold = true }
mode_unset  = { fg = "#0f1c16", bg = "#8ed1a3", bold = true }

progress_label  = { fg = "#e8f5d5", bold = true }
progress_normal = { fg = "#5bb7a5", bg = "#2e6146" }
progress_error  = { fg = "#ff6b6b", bg = "#2e6146" }

permissions_t = { fg = "#8ed1a3" }
permissions_r = { fg = "#c7df63" }
permissions_w = { fg = "#ff6b6b" }
permissions_x = { fg = "#5bb7a5" }
permissions_s = { fg = "#8ed1a3" }

# ═══════════════════════════════════════════════════════════
# 🎨 ENHANCED FILETYPE RULES - NEON COLOR CODING
# ═══════════════════════════════════════════════════════════
[filetype]
rules = [
    # ──────────────────────────────────────────────
    # 🌟 CRITICAL FILES - NEON RED
    # ──────────────────────────────────────────────
    { name = "PHILOSOPHY.md", fg = "#ff3366", bold = true },
    { name = "COMPLETE_GUIDE.md", fg = "#ff3366", bold = true },
    { name = ".envrc", fg = "#ff3366", bold = true },
    { name = ".gitleaks.toml", fg = "#ff3366", bold = true },
    
    # ──────────────────────────────────────────────
    # 📦 STOW PACKAGES - NEON CYAN (BRIGHT!)
    # ──────────────────────────────────────────────
    { name = "shell-zsh/", fg = "#00ffff", bold = true },
    { name = "editor-nvim/", fg = "#00ffff", bold = true },
    { name = "term-foot/", fg = "#00ffff", bold = true },
    { name = "fm-yazi/", fg = "#00ffff", bold = true },
    { name = "browser-qutebrowser/", fg = "#00ffff", bold = true },
    { name = "shell-nushell/", fg = "#00ffff", bold = true },
    { name = "config-faelight/", fg = "#00ffff", bold = true },
    { name = "prompt-starship/", fg = "#00ffff", bold = true },
    { name = "tools-topgrade/", fg = "#00ffff", bold = true },
    { name = "tools-gitleaks/", fg = "#00ffff", bold = true },
    { name = "tools-direnv/", fg = "#00ffff", bold = true },
    
    # ──────────────────────────────────────────────
    # 📚 IMPORTANT DOCS - NEON MAGENTA
    # ──────────────────────────────────────────────
    { name = "README.md", fg = "#ff00ff", bold = true },
    { name = "CHANGELOG*.md", fg = "#ff00ff", bold = true },
    { name = "THEORY_OF_OPERATION.md", fg = "#ff00ff", bold = true },
    { name = "INTENT/", fg = "#ff00ff", bold = true },
    
    # ──────────────────────────────────────────────
    # 🔧 SCRIPTS & TOOLS - NEON ORANGE
    # ──────────────────────────────────────────────
    { name = "scripts/", fg = "#ff9933", bold = true },
    { name = "rust-tools/", fg = "#ff9933", bold = true },
    { name = "*.sh", fg = "#ff9933", bold = true },
    
    # ──────────────────────────────────────────────
    # ⚙️  CONFIG FILES - NEON YELLOW
    # ──────────────────────────────────────────────
    { name = "*.toml", fg = "#ffff00", bold = true },
    { name = "*.yaml", fg = "#ffff00", bold = true },
    { name = "*.yml", fg = "#ffff00", bold = true },
    { name = "*.conf", fg = "#ffff00", bold = true },
    { name = "Cargo.toml", fg = "#ffff00", bold = true },
    
    # ──────────────────────────────────────────────
    # 🔗 SYMLINKS - BRIGHT MAGENTA
    # ──────────────────────────────────────────────
    { name = "*", is = "link", fg = "#ff66ff", bold = true },
    
    # ──────────────────────────────────────────────
    # 🎯 RUST CODE - NEON GREEN
    # ──────────────────────────────────────────────
    { name = "*.rs", fg = "#00ff00" },
    { name = "Cargo.lock", fg = "#00ff00" },
    
    # ──────────────────────────────────────────────
    # 📄 MARKDOWN - SOFT GREEN
    # ──────────────────────────────────────────────
    { name = "*.md", fg = "#8ed1a3" },
    
    # ──────────────────────────────────────────────
    # 📁 DIRECTORIES - STANDARD GREEN
    # ──────────────────────────────────────────────
    { name = "*/", fg = "#8ed1a3" },
    
    # ──────────────────────────────────────────────
    # 🔒 HIDDEN/DOTFILES - YELLOW
    # ──────────────────────────────────────────────
    { name = ".*", fg = "#c7df63", bold = true },
    
    # ──────────────────────────────────────────────
    # ⚡ EXECUTABLES - TEAL
    # ──────────────────────────────────────────────
    { name = "*", is = "exec", fg = "#5bb7a5" },
    
    # ──────────────────────────────────────────────
    # 📄 DEFAULT FILES - STANDARD
    # ──────────────────────────────────────────────
    { name = "*", fg = "#e8f5d5" }
]

# ═══════════════════════════════════════════════════════════
# 🎨 ENHANCED ICON RULES
# ═══════════════════════════════════════════════════════════
[icon]
rules = [
    # ──────────────────────────────────────────────
    # 🌟 CRITICAL FILES
    # ──────────────────────────────────────────────
    { name = "PHILOSOPHY.md", text = "📜" },
    { name = "COMPLETE_GUIDE.md", text = "📖" },
    { name = ".envrc", text = "🔐" },
    { name = ".gitleaks.toml", text = "🛡️" },
    
    # ──────────────────────────────────────────────
    # 📦 STOW PACKAGES
    # ──────────────────────────────────────────────
    { name = "shell-zsh/", text = "🐚" },
    { name = "editor-nvim/", text = "📝" },
    { name = "term-foot/", text = "💻" },
    { name = "fm-yazi/", text = "📁" },
    { name = "browser-qutebrowser/", text = "🌐" },
    { name = "config-faelight/", text = "⚙️" },
    
    # ──────────────────────────────────────────────
    # 📚 IMPORTANT DOCS
    # ──────────────────────────────────────────────
    { name = "README.md", text = "📘" },
    { name = "CHANGELOG*.md", text = "📋" },
    { name = "THEORY_OF_OPERATION.md", text = "🧠" },
    { name = "INTENT/", text = "🎯" },
    
    # ──────────────────────────────────────────────
    # 🔧 SCRIPTS & TOOLS
    # ──────────────────────────────────────────────
    { name = "scripts/", text = "🔧" },
    { name = "rust-tools/", text = "🦀" },
    { name = "*.sh", text = "📜" },
    
    # ──────────────────────────────────────────────
    # ⚙️  CONFIG FILES
    # ──────────────────────────────────────────────
    { name = "*.toml", text = "⚙️" },
    { name = "*.yaml", text = "⚙️" },
    { name = "*.yml", text = "⚙️" },
    { name = "Cargo.toml", text = "📦" },
    
    # ──────────────────────────────────────────────
    # 🔗 SYMLINKS
    # ──────────────────────────────────────────────
    { name = "*", is = "link", text = "🔗" },
    
    # ──────────────────────────────────────────────
    # 📁 DIRECTORIES
    # ──────────────────────────────────────────────
    { name = "*/", text = "📁" }
]
