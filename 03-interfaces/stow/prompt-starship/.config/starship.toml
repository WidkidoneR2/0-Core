# ═══════════════════════════════════════════════════════════
# 🌲 Starship Config - Faelight Forest v8.6.0
# Enhanced with git diff stats, profile icons, and health monitoring
# ═══════════════════════════════════════════════════════════

"$schema" = "https://starship.rs/config-schema.json"

# Main prompt
format = """
[┌─](bold green) \
${custom.faelight_zone}${custom.smart_path}${custom.cargo_root}${custom.intent_incidents}$os$username$hostname${custom.core_lock}${custom.profile_enhanced}${custom.health_dots}${custom.entropy}${custom.git_risk} $git_branch $git_status${custom.git_diff_stats}$nodejs$python$rust${custom.rust_toolchain}$cmd_duration
[└─](bold green)$character
"""

add_newline = true
command_timeout = 1000

# ──────────────────────────────────────────────
# Prompt Character
# ──────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ──────────────────────────────────────────────
# OS
# ──────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol](bold green)"

[os.symbols]
Arch = " "

# ──────────────────────────────────────────────
# Username + Hostname
# ──────────────────────────────────────────────
[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
format = "[@$hostname](bold green) "

# ──────────────────────────────────────────────
# Git Branch
# ──────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bold purple"
format = "[$symbol$branch]($style)"

# ──────────────────────────────────────────────
# Git Status - Enhanced with counts
# ──────────────────────────────────────────────
[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "[⚔](bold red)"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "[?${count}](yellow)"
stashed    = "[${count}](cyan)"
modified   = "[!${count}](bold red)"
staged     = "[+${count}](bold green)"
renamed    = "[»${count}](purple)"
deleted    = "[✘${count}](red)"

# ──────────────────────────────────────────────
# Node / Python / Rust
# ──────────────────────────────────────────────
[nodejs]
symbol = " "
style  = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style  = "bold yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style  = "bold red"
format = "[$symbol($version )]($style)"

# ──────────────────────────────────────────────
# Command duration
# ──────────────────────────────────────────────
[cmd_duration]
min_time = 500
style    = "bold yellow"
format   = "[took $duration]($style) "

# ──────────────────────────────────────────────
# Status
# ──────────────────────────────────────────────
[status]
style  = "bold red"
symbol = "✘ "
format = "[$symbol$status]($style) "
disabled = false

# ══════════════════════════════════════════════════════════
# 🌲 FAELIGHT FOREST CUSTOM MODULES
# ══════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# Smart Path - Don't duplicate zone name
# ──────────────────────────────────────────────
[custom.smart_path]
command = '''
# Show relative path from 0-core if inside it
if [[ "$PWD" == "$HOME/0-core/"* ]]; then
  echo "${PWD#$HOME/0-core/} "
else
  echo "$(basename "$PWD") "
fi
'''
when = '''
zone=$(faelight-zone 2>/dev/null | sed "s/.*[[:space:]]//" | tr '[:upper:]' '[:lower:]' | tr -d '-')
pwd_lower=$(basename "$PWD" | tr '[:upper:]' '[:lower:]' | tr -d '-')
# Only show if NOT in a zone root
! [[ "$zone" == *"$pwd_lower"* ]] && ! [[ "$pwd_lower" == *"$zone"* ]]
'''
format = "[$output]($style)"
style = "bold cyan"


# ──────────────────────────────────────────────
# 🔒 Core Lock Status (0-core only)
# ──────────────────────────────────────────────
[custom.core_lock]
command = 'lsattr -d ~/0-core 2>/dev/null | grep -q -- "----i" && echo "🔒" || echo "🔓"'
when = '[ "${PWD##$HOME/0-core}" != "$PWD" ]'
format = "[$output]($style)"
style = "bold yellow"

# ──────────────────────────────────────────────
# 🎯 Enhanced Profile with Icons
# ──────────────────────────────────────────────
[custom.profile_enhanced]
command = '''
profile=$(cat ~/.local/state/0-core/current-profile 2>/dev/null || echo "default")
case "$profile" in
  work) echo "💼 WORK" ;;
  gaming) echo "🎮 GAMING" ;;
  low-power) echo "🔋 LOW-POWER" ;;
  dev)  echo "🛠️  DEV" ;;
  default) echo "" ;;
  *) echo "🌱 $profile" ;;
esac
'''
when = '[[ -f ~/.local/state/0-core/current-profile ]] && [[ "$(cat ~/.local/state/0-core/current-profile)" != "default" ]]'
format = "[$output]($style)"
style = "bold cyan"

# ──────────────────────────────────────────────
# 🏥 Health Status (0-core only, optional)
# ──────────────────────────────────────────────
[custom.health_status]
command = '''
if command -v doctor >/dev/null 2>&1; then
  health=$(doctor 2>/dev/null | grep "Health:" | awk "{print \$2}" | tr -d "%")
  if [ -n "$health" ]; then
    if [ "$health" -eq 100 ]; then
      echo "🟢 ${health}%"
    elif [ "$health" -ge 90 ]; then
      echo "🟡 ${health}%"
    else
      echo "🔴 ${health}%"
    fi
  fi
fi
'''
when = '[ "${PWD##$HOME/0-core}" != "$PWD" ]'
format = "[$output]($style)"
style = "bold white"

# ──────────────────────────────────────────────
# 📊 Git Diff Stats
# ──────────────────────────────────────────────
[custom.git_diff_stats]
command = '''
if git rev-parse --git-dir >/dev/null 2>&1; then
  stats=$(git diff --stat 2>/dev/null | tail -1)
  if [ -n "$stats" ]; then
    files=$(echo "$stats" | awk "{print \$1}")
    changes=$(echo "$stats" | sed "s/.*,//")
    echo "±$files $changes"
  fi
fi
'''
when = 'git rev-parse --git-dir >/dev/null 2>&1'
format = "[($output)]($style)"
style = "bold magenta"

# ──────────────────────────────────────────────
# Faelight Zone - Spatial Awareness
# ──────────────────────────────────────────────
[custom.faelight_zone]
command = "faelight-zone"
when = "true"
format = "[$output]($style) "
style = "bold green"
description = "Shows current filesystem zone"

# ──────────────────────────────────────────────
# Cargo Root Detection
# ──────────────────────────────────────────────
[custom.cargo_root]
command = 'test -f Cargo.toml && echo "📦 root" || echo "↳ subdir"'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = "[$output]($style)"
style = "bold yellow"
description = "Shows if you're in cargo root or subdirectory"

# ──────────────────────────────────────────────
# Intent Ledger - Open Incidents
# ──────────────────────────────────────────────
[custom.intent_incidents]
command = 'intent list incidents --open 2>/dev/null | grep -E "^\s+[0-9]{3}" | grep -v "\[resolved\]" | wc -l'
when = '''
command -v intent >/dev/null 2>&1 && \
count=$(intent list incidents --open 2>/dev/null | grep -E "^\s+[0-9]{3}" | grep -v "\[resolved\]" | wc -l) && \
[ "$count" -gt 0 ]
'''
format = "[⚠ $output open]($style) "
style = "bold red"
description = "Shows count of open Intent Ledger incidents (only when >0)"
# ──────────────────────────────────────────────
# Rust Toolchain
# ──────────────────────────────────────────────
[custom.rust_toolchain]
command = 'rustc --version | cut -d" " -f2'
when = '[ -f rust-toolchain.toml ]'
format = "[🦀 $output]($style) "
style = "bold red"
description = "Shows Rust version when rust-toolchain.toml exists"

# ──────────────────────────────────────────────
# 🏥 Health Dots - Signal Only (0-core only)
# ──────────────────────────────────────────────
[custom.health_dots]
command = '''
if command -v doctor >/dev/null 2>&1; then
  output=$(doctor 2>/dev/null)
  health=$(echo "$output" | grep "Health:" | awk "{print \$2}" | tr -d "%")
  
  if [ -n "$health" ] && [ "$health" -lt 100 ]; then
    warnings=$(echo "$output" | grep -c "⚠️")
    failures=$(echo "$output" | grep -c "❌")
    total=15
    bad=$((warnings + failures))
    good=$((total - bad))
    
    dots=""
    for i in $(seq 1 $good); do dots="${dots}✔︎"; done
    for i in $(seq 1 $bad); do dots="${dots}◐"; done
    
    echo "$dots"
  fi
fi
'''
when = '[ "${PWD##$HOME/0-core}" != "$PWD" ]'
format = "[$output]($style) "
style = "bold white"

# ──────────────────────────────────────────────
# 🌀 Entropy Meter - System Drift Indicator
# ──────────────────────────────────────────────
[custom.entropy]
command = '''
if [ "${PWD##$HOME/0-core}" != "$PWD" ]; then
  entropy_score=0
  
  if git rev-parse --git-dir >/dev/null 2>&1; then
    uncommitted=$(git status --porcelain 2>/dev/null | wc -l)
    unpushed=$(git log @{u}.. 2>/dev/null | wc -l)
    entropy_score=$((entropy_score + uncommitted + unpushed))
  fi
  
  if command -v doctor >/dev/null 2>&1; then
    health=$(doctor 2>/dev/null | grep "Health:" | awk "{print \$2}" | tr -d "%")
    if [ -n "$health" ]; then
      degradation=$((100 - health))
      entropy_score=$((entropy_score + degradation * 2))
    fi
  fi
  
  if command -v intent >/dev/null 2>&1; then
    intents=$(intent list incidents --open 2>/dev/null | grep -E "^\s+[0-9]{3}" | grep -v "\[resolved\]" | wc -l)
    entropy_score=$((entropy_score + intents * 10))
  fi
  
  if [ "$entropy_score" -ge 50 ]; then
    echo "🌀unstable"
  elif [ "$entropy_score" -ge 20 ]; then
    echo "🌀rising"
  fi
fi
'''
when = '[ "${PWD##$HOME/0-core}" != "$PWD" ]'
format = "[$output]($style) "
style = "bold cyan"

# ──────────────────────────────────────────────
# ⚠️  Git Risk - Show blast radius and danger
# ──────────────────────────────────────────────
[custom.git_risk]
command = '''
if git rev-parse --git-dir >/dev/null 2>&1; then
  unpushed=$(git log @{u}.. 2>/dev/null | wc -l)
  uncommitted=$(git status --porcelain 2>/dev/null | wc -l)
  untracked=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l)
  
  in_core=false
  if [[ "$PWD" == *"0-core"* ]]; then
    in_core=true
  fi
  
  risk="LOW"
  if [ "$uncommitted" -gt 10 ] || [ "$unpushed" -gt 5 ]; then
    risk="MED"
  fi
  if [ "$uncommitted" -gt 20 ] || [ "$unpushed" -gt 10 ] || [ "$untracked" -gt 10 ]; then
    risk="HIGH"
  fi
  if [ "$in_core" = true ] && [ "$uncommitted" -gt 0 ]; then
    if [ "$risk" = "LOW" ]; then
      risk="MED"
    fi
  fi
  
  if [ "$uncommitted" -gt 0 ] || [ "$unpushed" -gt 0 ] || [ "$untracked" -gt 0 ]; then
    msg="git:"
    if [ "$risk" = "HIGH" ]; then
      msg="${msg}⚠︎ RISK=HIGH"
    elif [ "$risk" = "MED" ]; then
      msg="${msg}⚠︎ risk=MED"
    else
      msg="${msg}risk=LOW"
    fi
    
    details=""
    [ "$unpushed" -gt 0 ] && details="${details} ${unpushed}↑"
    [ "$uncommitted" -gt 0 ] && details="${details} ${uncommitted}±"
    [ "$untracked" -gt 0 ] && details="${details} ${untracked}?"
    
    echo "${msg}${details}"
  fi
fi
'''
when = 'git rev-parse --git-dir >/dev/null 2>&1'
format = "[$output]($style) "
style = "bold yellow"
