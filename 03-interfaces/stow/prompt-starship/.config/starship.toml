# ═══════════════════════════════════════════════════════════
# 🌲 Starship Config - Faelight Forest v10.0.0
# FM/Palette Aesthetic Edition
# ═══════════════════════════════════════════════════════════
"$schema" = "https://starship.rs/config-schema.json"

# Main prompt
format = """
[┌─](bold #a3e36b) \
${custom.faelight_zone}\
${custom.smart_path}\
🏠\
${custom.core_lock}\
${custom.profile_enhanced}\
${custom.git_risk}\
$git_branch \
$git_status\
$rust\
$cmd_duration
[└─](bold #a3e36b)$character
"""
add_newline = true
command_timeout = 5000

[character]
success_symbol = "[❯](#a3e36b)"
error_symbol   = "[❯](#c86464)"
vimcmd_symbol  = "[❮](#a3e36b)"

[git_branch]
symbol = " "
style  = "bold #6ba3e3"
format = "[$symbol$branch]($style)"

[git_status]
style = "#dae0d7"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "[⚔](#c86464)"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕${ahead_count}⇣${behind_count}"
untracked  = "[?${count}](#dae0d7)"
stashed    = "[${count}](#6ba3e3)"
modified   = "[!${count}](#c86464)"
staged     = "[+${count}](#a3e36b)"
renamed    = "[»${count}](#6ba3e3)"
deleted    = "[✘${count}](#c86464)"

[rust]
symbol = "󱘗 "
style  = "bold #c86464"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 500
style    = "#777f6f"
format   = "[took $duration]($style) "

# ──────────────────────────────────────────────
# Smart Path - Fixed to avoid duplication
# ──────────────────────────────────────────────
[custom.smart_path]
command = '''
if [[ "$PWD" == "$HOME/0-core" ]]; then
  # At 0-core root - zone already shows we're in 0-core
  echo ""
elif [[ "$PWD" == "$HOME/0-core/"* ]]; then
  # In 0-core subdirectory - show uppercase relative path
  relative="${PWD#$HOME/0-core/}"
  echo "${relative^^} "
elif [[ "$PWD" == "$HOME" ]]; then
  echo ""
else
  echo "$(basename "$PWD") "
fi
'''
when = 'true'
format = "[$output]($style)"
style = "bold #6ba3e3"

[custom.core_lock]
command = 'lsattr -d ~/0-core 2>/dev/null | grep -q -- "----i" && echo "🔒" || echo "🔓"'
when = '[[ "$PWD" == *"0-core"* ]]'
format = "[$output ]($style)"
style = "bold #dae0d7"

[custom.profile_enhanced]
command = '''
profile=$(cat ~/.local/state/0-core/current-profile 2>/dev/null || echo "default")
case "$profile" in
  work) echo "💼 WORK" ;;
  gaming) echo "🎮 GAMING" ;;
  low-power) echo "🔋 LOW-POWER" ;;
  dev)  echo "🛠️  DEV" ;;
  default) echo "" ;;
  *) echo "🌱 $profile" ;;
esac
'''
when = '[[ -f ~/.local/state/0-core/current-profile ]] && [[ "$(cat ~/.local/state/0-core/current-profile)" != "default" ]]'
format = "[$output ]($style)"
style = "bold #6ba3e3"

[custom.faelight_zone]
command = "faelight-zone"
when = "true"
format = "[$output ]($style)"
style = "bold #a3e36b"

[custom.git_risk]
command = '''
if git rev-parse --git-dir >/dev/null 2>&1; then
  unpushed=$(git log @{u}.. 2>/dev/null | wc -l)
  uncommitted=$(git status --porcelain 2>/dev/null | wc -l)
  untracked=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l)
  
  in_core=false
  [[ "$PWD" == *"0-core"* ]] && in_core=true
  
  risk="LOW"
  [ "$uncommitted" -gt 10 ] || [ "$unpushed" -gt 5 ] && risk="MED"
  [ "$uncommitted" -gt 20 ] || [ "$unpushed" -gt 10 ] || [ "$untracked" -gt 10 ] && risk="HIGH"
  [ "$in_core" = true ] && [ "$uncommitted" -gt 0 ] && [ "$risk" = "LOW" ] && risk="MED"
  
  if [ "$uncommitted" -gt 0 ] || [ "$unpushed" -gt 0 ] || [ "$untracked" -gt 0 ]; then
    echo "git:${risk}"
  fi
fi
'''
when = 'git rev-parse --git-dir >/dev/null 2>&1'
format = "[$output ]($style) "
style = "bold #dae0d7"
