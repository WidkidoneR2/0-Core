# ═══════════════════════════════════════════════════════════
# 🌲 Starship Config - Faelight Forest v9.3.0
# OPTIMIZED Edition - Fast + Feature-Rich!
# ═══════════════════════════════════════════════════════════
"$schema" = "https://starship.rs/config-schema.json"

# Main prompt - SAME VISUAL STYLE, OPTIMIZED!
format = """
[┌─](bold green) \
${custom.health_dot}\
${custom.faelight_zone}\
🏠\
${custom.core_lock} \
${custom.profile_enhanced}\
${custom.git_risk}\
$git_branch \
$git_status\
$rust\
${custom.rust_toolchain}\
$cmd_duration
[└─](bold green)$character
"""
add_newline = true
command_timeout = 100  # OPTIMIZED: 1000ms → 100ms

# ──────────────────────────────────────────────
# Prompt Character
# ──────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ──────────────────────────────────────────────
# OS
# ──────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol](bold green)"

[os.symbols]
Arch = " "

# ──────────────────────────────────────────────
# Username + Hostname
# ──────────────────────────────────────────────
[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
format = "[@$hostname](bold green) "

# ──────────────────────────────────────────────
# Git Branch
# ──────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bold purple"
format = "[$symbol$branch]($style)"

# ──────────────────────────────────────────────
# Git Status - Enhanced with counts
# ──────────────────────────────────────────────
[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "[⚔](bold red)"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "[?${count}](yellow)"
stashed    = "[${count}](cyan)"
modified   = "[!${count}](bold red)"
staged     = "[+${count}](bold green)"
renamed    = "[»${count}](purple)"
deleted    = "[✘${count}](red)"

# ──────────────────────────────────────────────
# Node / Python / Rust (KEPT - Fast!)
# ──────────────────────────────────────────────
[nodejs]
symbol = " "
style  = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style  = "bold yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style  = "bold red"
format = "[$symbol($version )]($style)"

# ──────────────────────────────────────────────
# Command duration
# ──────────────────────────────────────────────
[cmd_duration]
min_time = 500
style    = "bold yellow"
format   = "[took $duration]($style) "

# ──────────────────────────────────────────────
# Status
# ──────────────────────────────────────────────
[status]
style  = "bold red"
symbol = "✘ "
format = "[$symbol$status]($style) "
disabled = false

# ══════════════════════════════════════════════════════════
# 🌲 FAELIGHT FOREST CUSTOM MODULES - OPTIMIZED!
# ══════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# Smart Path - OPTIMIZED (faster check)
# ──────────────────────────────────────────────
[custom.smart_path]
command = '''
if [[ "$PWD" == "$HOME/0-core/"* ]]; then
  echo "${PWD#$HOME/0-core/} "
else
  echo "$(basename "$PWD") "
fi
'''
when = 'true'  # OPTIMIZED: Always show, simpler logic
format = "[$output ]($style)"
style = "bold cyan"

# ──────────────────────────────────────────────
# 🔒 Core Lock Status - OPTIMIZED (cached)
# ──────────────────────────────────────────────
[custom.core_lock]
command = 'lsattr -d ~/0-core 2>/dev/null | grep -q -- "----i" && echo "🔒" || echo "🔓"'
when = '[[ "$PWD" == *"0-core"* ]]'  # OPTIMIZED: Simpler check
format = "[$output ]($style)"
style = "bold yellow"

# ──────────────────────────────────────────────
# 🎯 Enhanced Profile - KEPT (fast file read)
# ──────────────────────────────────────────────
[custom.profile_enhanced]
command = '''
profile=$(cat ~/.local/state/0-core/current-profile 2>/dev/null || echo "default")
case "$profile" in
  work) echo "💼 WORK" ;;
  gaming) echo "🎮 GAMING" ;;
  low-power) echo "🔋 LOW-POWER" ;;
  dev)  echo "🛠️  DEV" ;;
  default) echo "" ;;
  *) echo "🌱 $profile" ;;
esac
'''
when = '[[ -f ~/.local/state/0-core/current-profile ]] && [[ "$(cat ~/.local/state/0-core/current-profile)" != "default" ]]'
format = "[$output ]($style)"
style = "bold cyan"

# ──────────────────────────────────────────────
# Faelight Zone - KEPT (fast, cached)
# ──────────────────────────────────────────────
[custom.faelight_zone]
command = "faelight-zone"
when = "true"
format = "[$output ]($style) "
style = "bold green"
description = "Shows current filesystem zone"

# ──────────────────────────────────────────────
# Cargo Root - KEPT (simple file check)
# ──────────────────────────────────────────────
[custom.cargo_root]
command = 'test -f Cargo.toml && echo "📦 root" || echo ""'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
format = "[$output ]($style)"
style = "bold yellow"

# ──────────────────────────────────────────────
# Intent Incidents - OPTIMIZED (only in 0-core)
# ──────────────────────────────────────────────
[custom.intent_incidents]
command = 'intent list incidents --open 2>/dev/null | grep -E "^\s+[0-9]{3}" | grep -v "\[resolved\]" | wc -l'
when = '[[ "$PWD" == *"0-core"* ]] && command -v intent >/dev/null 2>&1'  # OPTIMIZED: Only in 0-core
format = "[⚠ $output open]($style) "
style = "bold red"

# ──────────────────────────────────────────────
# Rust Toolchain - KEPT (conditional, fast)
# ──────────────────────────────────────────────
[custom.rust_toolchain]
command = 'rustc --version | cut -d" " -f2'
when = '[ -f rust-toolchain.toml ]'
format = "[🦀 $output]($style) "
style = "bold red"

# ──────────────────────────────────────────────
# 🏥 Health Dots - OPTIMIZED (only in 0-core)
# Shows visual health indicator when < 100%
# ──────────────────────────────────────────────
# ──────────────────────────────────────────────
# ⚠️  Git Risk - KEPT (pure git, fast!)
# ──────────────────────────────────────────────
[custom.git_risk]
command = '''
if git rev-parse --git-dir >/dev/null 2>&1; then
  unpushed=$(git log @{u}.. 2>/dev/null | wc -l)
  uncommitted=$(git status --porcelain 2>/dev/null | wc -l)
  untracked=$(git ls-files --others --exclude-standard 2>/dev/null | wc -l)
  
  in_core=false
  [[ "$PWD" == *"0-core"* ]] && in_core=true
  
  risk="LOW"
  [ "$uncommitted" -gt 10 ] || [ "$unpushed" -gt 5 ] && risk="MED"
  [ "$uncommitted" -gt 20 ] || [ "$unpushed" -gt 10 ] || [ "$untracked" -gt 10 ] && risk="HIGH"
  [ "$in_core" = true ] && [ "$uncommitted" -gt 0 ] && [ "$risk" = "LOW" ] && risk="MED"
  
  if [ "$uncommitted" -gt 0 ] || [ "$unpushed" -gt 0 ] || [ "$untracked" -gt 0 ]; then
    msg="git:"
    [ "$risk" = "HIGH" ] && msg="${msg}⚠︎ RISK=HIGH"
    [ "$risk" = "MED" ] && msg="${msg}⚠︎ risk=MED"
    [ "$risk" = "LOW" ] && msg="${msg}risk=LOW"
    
    details=""
    [ "$unpushed" -gt 0 ] && details="${details} ${unpushed}↑"
    [ "$uncommitted" -gt 0 ] && details="${details} ${uncommitted}±"
    [ "$untracked" -gt 0 ] && details="${details} ${untracked}?"
    
    echo "git:${risk}"
  fi
fi
'''
when = 'git rev-parse --git-dir >/dev/null 2>&1'
format = "[$output ]($style) "
style = "bold yellow"

# ══════════════════════════════════════════════════════════
# REMOVED MODULES (Too slow for every prompt):
# - entropy (complex calculation)
# - git_diff_stats (git diff on every prompt)
# - health_status (redundant with health_dots)
#
# Use aliases to check these manually:
# - 'd' or 'doctor' for health
# - 'entropy' for drift check
# ══════════════════════════════════════════════════════════


# Health status indicator - visual dot





[custom.health_dot]
command = '/home/christian/0-core/scripts/prompt-health-dot'
when = 'true'
format = '[$output ]($style)'
style = 'bold'
