[package]
name = "core"
version = "2.0.0"
edition = "2021"
description = "0-Core v2 — single orchestrator binary"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
walkdir = "2.5"
