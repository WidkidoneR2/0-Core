# Faelight Forest -- helix theme
# Colors from forest DNA

"ui.background" = { bg = "#0a0f14" }
"ui.text" = { fg = "#a9dfff" }
"ui.cursor" = { fg = "#0a0f14", bg = "#00bfff" }
"ui.cursor.primary" = { fg = "#0a0f14", bg = "#00bfff" }
"ui.selection" = { bg = "#1a2f3f" }
"ui.linenr" = { fg = "#2a4a5a" }
"ui.linenr.selected" = { fg = "#00bfff" }
"ui.statusline" = { fg = "#a9dfff", bg = "#0d1a22" }
"ui.statusline.inactive" = { fg = "#2a4a5a", bg = "#0a0f14" }
"ui.popup" = { bg = "#0d1a22" }
"ui.window" = { fg = "#1a2f3f" }
"ui.help" = { fg = "#a9dfff", bg = "#0d1a22" }
"ui.menu" = { fg = "#a9dfff", bg = "#0d1a22" }
"ui.menu.selected" = { fg = "#0a0f14", bg = "#00bfff" }

# Syntax
"keyword" = { fg = "#00bfff", modifiers = ["bold"] }
"keyword.control" = { fg = "#00e0ff" }
"keyword.function" = { fg = "#00bfff", modifiers = ["bold"] }
"function" = { fg = "#2affd5" }
"function.builtin" = { fg = "#2affd5", modifiers = ["bold"] }
"type" = { fg = "#00ff88", modifiers = ["bold"] }
"type.builtin" = { fg = "#00ff88" }
"constructor" = { fg = "#00ff88" }
"variable" = { fg = "#a9dfff" }
"variable.builtin" = { fg = "#00e0ff", modifiers = ["italic"] }
"variable.parameter" = { fg = "#d7e0da" }
"constant" = { fg = "#ffd43b" }
"constant.builtin" = { fg = "#ffd43b", modifiers = ["bold"] }
"constant.numeric" = { fg = "#ffd43b" }
"string" = { fg = "#00ff88" }
"string.special" = { fg = "#2affd5" }
"comment" = { fg = "#3a6a5a", modifiers = ["italic"] }
"attribute" = { fg = "#00e0ff" }
"operator" = { fg = "#00bfff" }
"punctuation" = { fg = "#5a8a9a" }
"punctuation.bracket" = { fg = "#5a8a9a" }
"namespace" = { fg = "#00e0ff", modifiers = ["italic"] }
"label" = { fg = "#00ff88" }

# Diagnostics
"diagnostic.error" = { underline = { color = "#ff4c4c", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#ffd43b", style = "curl" } }
"diagnostic.info" = { underline = { color = "#00bfff", style = "curl" } }
"diagnostic.hint" = { underline = { color = "#2affd5", style = "curl" } }
"error" = { fg = "#ff4c4c" }
"warning" = { fg = "#ffd43b" }
"info" = { fg = "#00bfff" }
"hint" = { fg = "#2affd5" }

# Diff
"diff.plus" = { fg = "#00ff88" }
"diff.minus" = { fg = "#ff4c4c" }
"diff.delta" = { fg = "#ffd43b" }
