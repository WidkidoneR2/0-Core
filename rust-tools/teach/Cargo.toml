[package]
name = "teach"
version = "3.0.0"
edition = "2021"
description = "Interactive learning system - teach 0-Core concepts"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"
