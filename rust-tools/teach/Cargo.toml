[package]
name = "teach"
version = "4.0.0"
edition = "2021"
description = "Live system narrator — adapts to newcomer or expert"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"
