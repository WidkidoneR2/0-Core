[package]
name = "security-audit"
version = "1.0.0"
edition = "2021"
description = "Security audit and vulnerability scanner for Faelight Forest"

[dependencies]
faelight-core = { path = "../faelight-core" }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "security-audit"
path = "src/main.rs"
