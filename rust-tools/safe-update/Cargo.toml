[package]
name = "safe-update"
version = "2.1.0"
edition = "2021"
description = "Safe system updater - snapshot before updating"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"

[[bin]]
name = "safe-update"
path = "src/main.rs"
