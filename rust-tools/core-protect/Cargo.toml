[package]
name = "core-protect"
version = "2.3.0"
edition = "2021"
description = "System guardian - immutable protection for 0-core"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"
anyhow.workspace = true

[[bin]]
name = "core-protect"
path = "src/main.rs"
