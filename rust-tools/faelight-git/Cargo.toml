[package]
name = "faelight-git"
version = "4.0.0"
edition = "2021"
description = "Git governance for Faelight Forest"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
faelight-core = { path = "../faelight-core" }
# Existing
clap = { version = "4", features = ["derive"] }
colored = "2"

# NEW: Git library
git2 = "0.18"

# NEW: Error handling
anyhow = "1.0"
thiserror = "1.0"

# NEW: For risk/graph storage
serde_json = "1.0"
chrono = "0.4"

# NEW: Shared Faelight infrastructure

