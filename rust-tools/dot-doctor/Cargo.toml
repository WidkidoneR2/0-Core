[package]
name = "dot-doctor"
version = "4.0.0"
edition = "2021"
description = "Faelight Forest Health Engine - System health checker"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Utilities
walkdir = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "dot-doctor"
path = "src/main.rs"
