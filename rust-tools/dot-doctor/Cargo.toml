[package]
name = "dot-doctor"
version = "2.0.0"
edition = "2021"
description = "Faelight Forest Health Engine"

[dependencies]
walkdir = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
