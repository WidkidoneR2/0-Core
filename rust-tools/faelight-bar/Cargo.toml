[package]
name = "faelight-bar"
license = "MIT"
version = "3.0.0"
edition = "2021"

[[bin]]
name = "faelight-bar"
path = "src/main.rs"

[dependencies]
# Wayland layer shell
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = { workspace = true }

# Beautiful font rendering -- same library faelight-term uses internally
cosmic-text = "0.12"

# Forest
faelight-core = { path = "../faelight-core" }
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
