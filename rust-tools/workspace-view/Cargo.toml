[package]
name = "workspace-view"
version = "2.0.0"
edition = "2021"
description = "Sway workspace intelligence - monitor and inspect workspaces"

[dependencies]
# Core infrastructure (for future enhancements)
faelight-core = { path = "../faelight-core" }

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Joyful colors
colored = "2.1"

# CLI
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "workspace-view"
path = "src/main.rs"
