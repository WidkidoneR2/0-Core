[package]
name = "faelight-contextd"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "Background awareness daemon — the nervous system of Faelight Forest"
[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
colored = "2"
[[bin]]
name = "faelight-contextd"
path = "src/main.rs"
