[package]
name = "entropy-check"
version = "2.0.0"
edition = "2021"
description = "System entropy monitor - detect configuration changes"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Joyful colors
colored = "2.1"

[[bin]]
name = "entropy-check"
path = "src/main.rs"
