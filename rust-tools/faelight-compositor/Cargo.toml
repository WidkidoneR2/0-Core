[package]
name = "faelight-compositor"
version = "0.1.0"
edition = "2021"
description = "faelight-compositor — The compositor that joins the family"

[dependencies]
smithay = { workspace = true }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", package = "smithay-drm-extras" }
faelight-core = { path = "../faelight-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
gbm = "0.18"
drm = "0.14"
drm-fourcc = "2.2"
input = "0.9"

[[bin]]
name = "faelight-compositor"
path = "src/main.rs"
