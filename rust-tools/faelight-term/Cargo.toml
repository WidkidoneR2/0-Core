[package]
name = "faelight-term"
version = "10.2.0"
edition = "2021"

[dependencies]
faelight-core = { path = "../faelight-core" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1.10"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
swash = "0.1"
nix = { version = "0.29", features = ["term", "process", "fs"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
wl-clipboard-rs = "0.8"
vte = "0.13"

[[bin]]
name = "faelight-term"
path = "src/main.rs"
