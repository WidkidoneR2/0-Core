[package]
name = "faelight-term-v2"
version = "2.0.0"
edition = "2021"
[dependencies]
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
cosmic-text = "0.12"
nix = { version = "0.29", features = ["term", "process", "fs"] }
vte = "0.13"
wl-clipboard-rs = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
[[bin]]
name = "faelight-term-v2"
path = "src/main.rs"
