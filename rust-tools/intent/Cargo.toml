[package]
name = "intent"
version = "3.0.0"
edition = "2021"
description = "Intent Ledger - The heart of intentional computing 🎯"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Date/time
chrono = "0.4"
serde_yaml = "0.9"

# Joyful colors
colored = "2.1"

# Proper error handling
anyhow = "1.0"

# SIGPIPE handling
libc = "0.2"

[[bin]]
name = "intent"
path = "src/main.rs"
