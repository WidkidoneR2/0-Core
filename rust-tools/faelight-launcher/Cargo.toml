[package]
name = "faelight-launcher"
version = "4.0.0"
edition = "2021"
description = "Application launcher - path-resilient!"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# UI
image = "0.25"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
fontdue = "0.9"

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2"

