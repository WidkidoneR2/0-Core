[package]
name = "faelight-sandbox"
version = "3.0.0"
edition = "2021"
description = "Controlled experimentation environment for Faelight Forest"

[dependencies]
faelight-core = { path = "../faelight-core" }
clap = { version = "4", features = ["derive"] }
colored = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
seccompiler = "0.5"
libc = "0.2"
