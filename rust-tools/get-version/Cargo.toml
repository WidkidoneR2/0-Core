[package]
name = "get-version"
version = "4.0.0"
edition = "2021"
description = "Get system version from VERSION file"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# CLI
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "get-version"
path = "src/main.rs"
