[package]
name = "faelight-palette"
version = "2.0.0"
edition = "2021"
description = "🎨 The legendary command palette - Terminal TUI Edition"

[[bin]]
name = "faelight-palette"
path = "src/main.rs"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# Fuzzy search
fuzzy-matcher = "0.3"

# Process execution
anyhow = "1.0"

# CLI parsing
clap = { version = "4.4", features = ["derive"] }
atty = "0.2"
