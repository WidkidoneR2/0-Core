[package]
name = "faelight"
version = "2.1.0"
edition = "2021"
description = "Unified CLI for Faelight Forest"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
faelight-core = { path = "../faelight-core" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
which = "6.0"

[[bin]]
name = "faelight"
path = "src/main.rs"
