[package]
name = "faelight"
version = "2.0.0"
edition = "2021"
description = "Unified CLI for Faelight Forest"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
faelight-core = { path = "../faelight-core" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
which = "6.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
