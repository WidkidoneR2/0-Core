[package]
name = "recent-files"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Recent files dashboard - find files by modification time"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Utilities
walkdir = "2.5"
chrono = "0.4"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "recent-files"
path = "src/main.rs"
