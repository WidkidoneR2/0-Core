[package]
name = "faelight-shell"
license = "MIT"
version = "2.1.0"
edition = "2021"
description = "Forest-native structured shell environment — beyond NixOS"

[dependencies]
rustyline = "17.0.2"
colored = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
ctrlc = "3"
toml = "0.8"
faelight-git = { path = "../faelight-git" }
git2 = "0.18"
libc = "0.2"
ratatui = "0.28"
crossterm = "0.28"
portable-pty = "0.8"
