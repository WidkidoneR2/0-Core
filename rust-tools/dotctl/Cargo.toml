[package]
name = "dotctl"
version = "3.1.0"
edition = "2021"
description = "Dotfile control center - manage stow packages and versions"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Modern CLI
clap = { version = "4", features = ["derive"] }

# Beautiful output
colored = "2.1"
faelight-zone = { path = "../faelight-zone" }

[[bin]]
name = "dotctl"
path = "src/main.rs"
