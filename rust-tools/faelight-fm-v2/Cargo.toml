[package]
name = "faelight-fm-v2"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Forest-native file manager -- INT-293"

# Standalone -- not part of main workspace (libcosmic git deps conflict with workspace tokio)

[dependencies]
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["wayland", "wgpu"]

[features]
default = ["wayland"]
wayland = ["libcosmic/wayland"]
