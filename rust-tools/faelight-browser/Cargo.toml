[package]
name = "faelight-browser"
license = "MIT"
version = "0.4.0"
edition = "2021"
authors = ["Christian"]
description = "A browser built on 0-Core principles - security, transparency, comprehension"


[[bin]]
name = "faelight-browser-tui"
path = "src/bin/tui.rs"

[lib]
name = "faelight_browser"
path = "src/lib.rs"

[dependencies]
# Core
faelight-core = { path = "../faelight-core" }

# Wayland (for graphical version)
smithay-client-toolkit = "0.19"
wayland-client = "0.31"

# TUI (for terminal version)
ratatui = "0.28"
crossterm = "0.28"
fuzzy-matcher = "0.3"

# Rendering (both versions)
fontdue = "0.9"
lazy_static = "1.4"

# Storage (flat files - human readable)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling (production-grade)
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
url = "2"

# Web rendering (secure HTTPS)
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
html2text = "0.12"

# Security
rustls = "0.23"
webpki-roots = "0.26"

# Async runtime
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
