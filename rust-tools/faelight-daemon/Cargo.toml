[package]
name = "faelight-daemon"
version = "2.1.0"
edition = "2021"
description = "Background daemon for Faelight Forest operations"

[dependencies]
# Core infrastructure
faelight-core = { path = "../faelight-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Pretty output
colored = "2"

[[bin]]
name = "faelight-daemon"
path = "src/main.rs"

[[bin]]
name = "test-client"
path = "src/bin/test-client.rs"
