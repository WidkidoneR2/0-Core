[package]
name = "faelight-login"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "faelight-login"
path = "src/main.rs"

[dependencies]
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
