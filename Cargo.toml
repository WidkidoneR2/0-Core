[workspace]
resolver = "2"
members = [
    "rust-tools/*",
    "engine",
]

[workspace.package]
version = "9.1.0"
edition = "2021"
authors = ["Christian <christian@faelight.forest>"]
license = "MIT"

[workspace.dependencies]
# Wayland ecosystem
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
smithay-client-toolkit = "0.18"
# Serde ecosystem
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
# CLI
clap = { version = "4.4", features = ["derive"] }
# Utilities
chrono = "0.4"
dirs = "5.0"
fontdue = "0.9"
regex = "1.10"

# Compositor
smithay = { git = "https://github.com/Smithay/smithay.git", default-features = false, features = ["desktop", "wayland_frontend", "backend_drm", "backend_udev", "backend_libinput", "backend_egl", "renderer_gl", "use_system_lib", "backend_winit", "backend_session_libseat", "renderer_multi", "backend_gbm"] }
